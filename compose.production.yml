name: dog_grooming

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dog_grooming_caddy_data:/data
      - dog_grooming_caddy_config:/config
    depends_on:
      web:
        condition: service_started

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dog_grooming
      POSTGRES_PASSWORD: ${DOG_GROOMING_DATABASE_PASSWORD}
      POSTGRES_DB: dog_grooming_production
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - dog_grooming_postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.production.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dog_grooming -d dog_grooming_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dog_grooming_evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DATABASE_PASSWORD}
      POSTGRES_DB: dog_grooming_evolution_production
    volumes:
      - dog_grooming_evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dog_grooming_evolution -d dog_grooming_evolution_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dog_grooming_evolution_redis_data:/data
    expose:
      - "6379"

  evolution-api:
    image: evoapicloud/evolution-api:v2.1.1
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://dog_grooming_evolution:${EVOLUTION_DATABASE_PASSWORD}@evolution-db:5432/dog_grooming_evolution_production
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CONFIG_SESSION_PHONE_CLIENT: Dog Grooming
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1042527945
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#ffded4"
    volumes:
      - dog_grooming_evolution_instances:/evolution/instances
    expose:
      - "8080"
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dog_grooming-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      # No heredar el modo de .env local: producción siempre usa credenciales reales.
      MERCADO_PAGO_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
      SOLID_QUEUE_IN_PUMA: "true"
      ACTIVE_STORAGE_SERVICE: r2
      FORCE_SSL: ${FORCE_SSL:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
      AUTOMATED_WHATSAPP_NOTIFICATIONS_ENABLED: "false"
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-dog-grooming-main}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      PORT: 3000
    expose:
      - "80"
    volumes:
      - dog_grooming_app_storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy
      evolution-api:
        condition: service_started

volumes:
  dog_grooming_caddy_data:
  dog_grooming_caddy_config:
  dog_grooming_postgres_data:
  dog_grooming_app_storage:
  dog_grooming_evolution_postgres_data:
  dog_grooming_evolution_redis_data:
  dog_grooming_evolution_instances:
