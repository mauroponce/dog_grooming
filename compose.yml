name: dog_grooming

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dog_grooming
      POSTGRES_PASSWORD: dog_grooming
      POSTGRES_DB: dog_grooming_development
    volumes:
      - dog_grooming_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1028:1025"
      - "8028:8025"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -lc "bundle install && bin/rails db:prepare && bin/rails tailwindcss:build && bin/rails server -b 0.0.0.0"
    environment:
      DB_HOST: db
      DB_USER: dog_grooming
      DB_PASSWORD: dog_grooming
      APP_HOST: ${APP_HOST:-localhost:3003}
      APP_PROTOCOL: ${APP_PROTOCOL:-http}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAILPIT_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      RAILS_ENV: development
      # El entorno de desarrollo siempre cobra contra las credenciales de prueba.
      MERCADO_PAGO_ENV: test
      MERCADO_PAGO_PUBLIC_KEY: ${MERCADO_PAGO_PUBLIC_KEY:-}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_CLIENT_ID: ${MERCADO_PAGO_CLIENT_ID:-}
      MERCADO_PAGO_CLIENT_SECRET: ${MERCADO_PAGO_CLIENT_SECRET:-}
      MERCADO_PAGO_TEST_PUBLIC_KEY: ${MERCADO_PAGO_TEST_PUBLIC_KEY:-}
      MERCADO_PAGO_TEST_ACCESS_TOKEN: ${MERCADO_PAGO_TEST_ACCESS_TOKEN:-}
      MERCADO_PAGO_TEST_CLIENT_ID: ${MERCADO_PAGO_TEST_CLIENT_ID:-}
      MERCADO_PAGO_TEST_CLIENT_SECRET: ${MERCADO_PAGO_TEST_CLIENT_SECRET:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
    volumes:
      - .:/rails
      - dog_grooming_bundle_data:/usr/local/bundle
    ports:
      - "3003:3000"
    depends_on:
      - db
      - mailpit

volumes:
  dog_grooming_postgres_data:
  dog_grooming_bundle_data:
