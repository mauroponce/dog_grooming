name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build development image
        run: docker compose build web

      - name: Run database and verification suite
        run: |
          docker compose up -d db
          docker compose run --rm -e RAILS_ENV=test web bash -lc '
            bin/rails db:prepare &&
            CI=1 bin/rails zeitwerk:check &&
            bundle exec rspec &&
            bin/rubocop -f github &&
            bin/bundler-audit &&
            bin/importmap audit &&
            bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
          '

      - name: Show database logs after failure
        if: failure()
        run: docker compose logs --tail=200 db
